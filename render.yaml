# This file tells Render how to deploy all your services.
# Place this file in the root of your GitHub repository.

services:
  # 1. Frontend Web Service (Free Tier)
  - type: web
    name: health-hackathon-frontend
    plan: free # Specifies the free instance type
    runtime: docker
    image:
      url: aanand2004/health-hackathon-frontend:latest
    # Health check to make sure the service is running
    healthCheckPath: /
    # Set up routing for your domain
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend Services (Combined into one Free Tier Private Service)
  - type: pserv # Correct type for a Private Service
    name: health-hackathon-backend
    plan: free
    runtime: docker
    image:
      url: aanand2004/health-hackathon-backend:latest
    # Define the ports your backend services listen on
    # Note: These are not publicly exposed
    ports:
      - port: 3001 # For the Node.js API
      - port: 5000 # For the OCR service
      - port: 8000 # For the Chatbot service
    # Securely add your environment variables in the Render dashboard
    envVars:
      - key: MONGO_URI
        fromSecret: true
      - key: JWT_SECRET
        fromSecret: true
      - key: EMAIL_USER
        fromSecret: true
      - key: EMAIL_PASS
        fromSecret: true
      - key: GEMINI_API_KEY
        fromSecret: true
