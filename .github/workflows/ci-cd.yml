# This workflow builds and pushes Docker images to Docker Hub

name: CI/CD Pipeline

# This workflow runs on every push to the 'main' or 'Deploy-Testing' branch
on:
  push:
    branches: [ "main", "Deploy-Testing" ]

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest # The job will run on a virtual machine hosted by GitHub
    steps:
      # Step 1: Check out your repository's code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push the frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: . # Use the root directory as the build context
          file: ./Dockerfile # Specify the frontend Dockerfile
          push: true
          tags: aanand2004/health-hackathon-frontend:latest

      # Step 4: Build and push the backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./server # Use the server directory as the build context
          file: ./server/Dockerfile # Specify the backend Dockerfile
          push: true
          tags: aanand2004/health-hackathon-backend:latest
