# k8s/service.yaml

# 1. Frontend Service (exposes the website to the internet)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer # Creates a cloud load balancer to direct traffic
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80       # Exposes the service on port 80
    targetPort: 80 # Routes traffic to port 80 on the container

---
# 2. Backend API Service (for internal communication)
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP # Only exposes the service inside the Kubernetes cluster
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001

---
# 3. OCR Service
apiVersion: v1
kind: Service
metadata:
  name: ocr-service
spec:
  type: ClusterIP
  selector:
    app: ocr
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000

---
# 4. Chatbot Service
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
