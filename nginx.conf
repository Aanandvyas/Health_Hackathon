# /nginx.conf

# Define the server block
server {
    # Listen on port 80, the default HTTP port
    listen 80;

    # Define the root directory where your website's files are located
    root /usr/share/nginx/html;

    # Set the default file to serve
    index index.html;

    # This is the crucial part for Single Page Applications (SPAs)
    # It tries to find a file that matches the request URI.
    # If it can't find a file or a directory, it falls back to serving /index.html.
    # This allows React Router to handle all the client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add headers to improve security and prevent caching issues
    add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
    etag off;
}
