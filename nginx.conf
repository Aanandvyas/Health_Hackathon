# This configuration is for serving the app from the root directory.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This is the crucial part for Single Page Applications (SPAs).
    # It tries to find a matching file, and if it can't, it
    # falls back to serving the main index.html file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
