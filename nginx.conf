# This configuration is for serving the app from a sub-path.
# Place this file in your project's ROOT directory.

server {
    listen 80;

    # This block handles all requests for your application
    location /Health-Menta/ {
        # 'alias' tells Nginx where to find the files on the server
        alias /usr/share/nginx/html/;
        
        # This is the crucial part for Single Page Applications (SPAs).
        # It tries to find a matching file, and if it can't, it
        # falls back to serving the main index.html file.
        try_files $uri $uri/ /Health-Menta/index.html;
    }

    # This is an optional but helpful redirect.
    # If a user goes to the root URL, it redirects them to your app.
    location = / {
        return 302 /Health-Menta/;
    }
}
